<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Google Reviews Exporter</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <header>
      <div class="logo">★</div>
      <div>
        <h1>Google Reviews Exporter</h1>
        <p>Extract reviews loaded in the current Google Maps tab.</p>
      </div>
    </header>

    <section class="controls">
      <label class="check">
        <input id="expandReviews" type="checkbox" checked />
        Expand visible “More” review text first
      </label>

      <div class="grid">
        <label>
          Scroll rounds
          <input id="maxScrolls" type="number" min="1" max="300" value="80" />
        </label>
        <label>
          Delay ms
          <input id="delayMs" type="number" min="250" max="5000" step="250" value="1200" />
        </label>
      </div>

      <button id="extractBtn" class="primary">Extract visible reviews</button>
      <button id="scrollExtractBtn">Auto-scroll then extract</button>
    </section>

    <section class="results">
      <div class="stats">
        <strong id="count">0</strong>
        <span>reviews captured</span>
      </div>
      <p id="status">Open a Google Maps business page, open its reviews panel, then run extraction.</p>
      <div class="actions">
        <button id="csvBtn" disabled>Download CSV</button>
        <button id="jsonBtn" disabled>Download JSON</button>
        <button id="copyBtn" disabled>Copy CSV</button>
      </div>
      <pre id="preview" aria-live="polite"></pre>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
